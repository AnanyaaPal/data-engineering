[build-system]
requires = ["setuptools-scm"]

[project]
name = "data-engineering"
version = "0.1.0"
description = "feature engineering on publically available datasets."
requires-python = ">3.11"
readme = "README.md"

dependencies = [
    "pandas>=3.0.1",
    "scikit-learn",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]
